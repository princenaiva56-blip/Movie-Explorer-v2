<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="src/css/movie.css">
    <link rel="stylesheet" href="src/css/responsive.css">
</head>
<body>

<header class="navbar">

    <div class="logo">Movie Explorer</div>

    <nav class="desktop-nav">
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
        <a href="favorites.html">Favorites</a>
        <a href="watchlist.html">WatchList</a>
    </nav>

    <button class="menu-toggle" aria-label="Open navigation">
        ☰
    </button>

</header>

<aside class="mobile-sidebar">

    <button class="close-menu" aria-label="Close navigation">
        &times;
    </button>

    <nav>
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
        <a href="favorites.html">Favorites</a>
        <a href="watchlist.html">WatchList</a>
    </nav>

</aside>

<div class="sidebar-overlay"></div>

    <main>

        <section class="movie-hero">

        <div class="movie-container">

            <div class="movie-poster">
                <img src="" alt="">
            </div>

            <div class="movie-content">

                <h1 class="movie-title"></h1>

                <p class="movie-meta"></p> 

                <div class="movie-genres"></div>

                <p class="movie-overview"></p>

                <div class="movie-buttons">

                    <button class="primary-btn">Watch Trailer</button>
                    <button class="secondary-btn favorites-btn">Add to Favorites</button>
                    <button class="secondary-btn" id="watchlist-btn">Add to Watchlist</button>
                </div>

            </div>
        </div>
        </section>

              <section class="cast">

            <div class="movie-section">

                <h2>Top Cast</h2>

                <div class="cast-container"></div>
            </div>
        </section>

        <section class="similar-movies">

            <div class="movie-section">

                <h2>Similar Movies</h2>

                <div class="movie-track  similar-container">

                </div>
            </div>
        </section>


    </main>

    <div class="trailer-modal">
    <div class="trailer-container">
        <button class="close-trailer">&times;</button>

        <iframe
            class="trailer-video"
            src=""
            title="Movie Trailer"
            frameborder="0"
            allow="autoplay; encrypted-media"
            allowfullscreen>
        </iframe>
    </div>
</div>

    <script type="module" src="src/js/movie.js"></script>
    <script type="module" src="src/js/favorites.js"></script>
    <script type="module" src="src/js/navigation.js"></script>
</body>
</html>
