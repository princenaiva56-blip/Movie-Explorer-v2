<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Explorer v2</title>
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="src/css/movie.css">
    <link rel="stylesheet" href="src/css/responsive.css">
</head>
<body>
    
<header class="navbar">

    <div class="logo">Movie Explorer</div>

    <nav class="desktop-nav">
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
        <a href="favorites.html">Favorites</a>
        <a href="watchlist.html">WatchList</a>
    </nav>

    <button class="menu-toggle" aria-label="Open navigation">
        ☰
    </button>

</header>

<aside class="mobile-sidebar">

    <button class="close-menu" aria-label="Close navigation">
        &times;
    </button>

    <nav>
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
        <a href="favorites.html">Favorites</a>
        <a href="watchlist.html">WatchList</a>
    </nav>

</aside>

<div class="sidebar-overlay"></div>



    <main>

        <section class="hero">
            
            <div class="hero-content">

                <p class="hero-tag"></p>

                <h1 class="hero-title"></h1>

                <p class="hero-meta"></p>

                <p class="hero-overview"></p>

                <div class="movie-buttons">

                    <button class="primary-btn">Watch Trailer</button>
                    <button class="secondary-btn">More Details</button>
                </div>
            </div>
        </section>

        <section class="trending">

            <div class="movie-section">
                <h2 class="trending-header">Trending</h2>

                <div class="movie-track trending-container">
                    
                
                </div>
            </div>
        </section>

        <section class="popular">

            <div class="movie-section">
                <h2 class="popular-header">Popular</h2>

                <div class="movie-track popular-container">
                    
                
                </div>
            </div>
        </section>


        <section class="top-rated">

            <div class="movie-section">
                <h2 class="toprated-header">Top rated</h2>

                <div class="movie-track toprated-container">
                    
                
                </div>
            </div>
        </section>



    </main>

    <script type="module" src="src/js/main.js" defer></script>
    <script type="module" src="src/js/movie.js"></script>
    <script type="module" src="src/js/navigation.js"></script>
</body>
</html>
